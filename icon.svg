<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fekete háttér (Opcionális, ha átlátszó pinket akarsz, ezt a rect-et törölheted) -->
  <rect width="512" height="512" fill="#000000"/>
  
  <!-- Pink Metro csempe háttér -->
  <rect x="64" y="64" width="384" height="384" fill="#FF0097"/>
  
  <!-- Naptár test (Fehér) -->
  <rect x="128" y="144" width="256" height="224" fill="none" stroke="#FFFFFF" stroke-width="24"/>
  
  <!-- Naptár felső sáv (Fehér kitöltés) -->
  <rect x="128" y="144" width="256" height="64" fill="#FFFFFF"/>
  
  <!-- Naptár lyukak (Pink, hogy átlátszónak tűnjön a felső sávon) -->
  <rect x="160" y="112" width="24" height="48" fill="#FF0097"/>
  <rect x="328" y="112" width="24" height="48" fill="#FF0097"/>
  
  <!-- Csempe rácsok a naptáron belül -->
  <rect x="160" y="240" width="48" height="48" fill="#FFFFFF"/>
  <rect x="232" y="240" width="48" height="48" fill="#FFFFFF"/>
  <rect x="304" y="240" width="48" height="48" fill="#FFFFFF"/>
  
  <rect x="160" y="304" width="48" height="48" fill="#FFFFFF"/>
  <rect x="232" y="304" width="48" height="48" fill="#FFFFFF"/>
  <!-- Egy hiányzó csempe a vizuális érdeklődésért -->
</svg>
