<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- iOS / Windows / Android kezdőképernyő beállítások -->
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="msapplication-TileColor" content="#FF0097">
    <meta name="msapplication-TileImage" content="icon-192.png">
    <meta name="theme-color" content="#FF0097">
    <link rel="manifest" href="manifest.json">

    <title>Calendar</title>
    
    <style>
        :root {
            --wp-black: #000000;
            --wp-white: #FFFFFF;
            --wp-gray: #1F1F1F;
            --wp-light-gray: #999999;
            --wp-accent: #FF0097; /* Klasszikus WP Pink */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--wp-black);
            color: var(--wp-white);
            font-family: 'Segoe WP', 'Segoe UI', sans-serif;
            padding: 24px 24px 80px 24px;
            overflow-x: hidden;
        }

        header { margin-bottom: 24px; }
        
        h1 {
            text-transform: uppercase;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--wp-light-gray);
            margin-bottom: 8px;
        }
        
        /* IE-kompatibilis fejléc elrendezés (float) */
        .month-header { overflow: hidden; margin-bottom: 16px; }
        
        .nav-btn {
            background: none; border: none; color: var(--wp-white);
            font-size: 24px; cursor: pointer; display: inline-block;
            float: left; padding: 0 16px 0 0;
        }
        
        #display-month {
            display: inline-block; float: left;
            font-size: 32px; font-weight: 300; line-height: 1;
            margin-top: -2px; text-transform: lowercase;
        }

        /* 3-napos nézet csempék (Biztonságos flow elrendezés) */
        .day-block {
            display: block;
            background-color: var(--wp-gray);
            color: var(--wp-white);
            text-decoration: none;
            padding: 16px;
            margin-bottom: 12px;
            min-height: 140px; /* Hagyja nyúlni, ha kell */
            position: relative;
            transition: background-color 0.1s;
        }
        
        .day-block:active { transform: scale(0.98); }
        .day-block.today { background-color: var(--wp-accent); }

        .day-label {
            font-size: 14px;
            text-transform: uppercase;
            color: var(--wp-light-gray);
            letter-spacing: 1px;
            margin-bottom: 4px; /* Távolságtartás a számtól */
            display: block;
        }
        .day-block.today .day-label { color: var(--wp-white); opacity: 0.8; }

        .day-date {
            font-size: 56px;
            font-weight: 300;
            line-height: 1;
            margin-bottom: 12px; /* Távolságtartás az esemény szövegétől */
            display: block;
        }

        .event-text {
            display: block;
            font-size: 16px;
            color: var(--wp-light-gray);
            
            /* Szöveg levágása ("..."), ha túl hosszú */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
        .day-block.today .event-text { color: var(--wp-white); opacity: 0.9; }
        .day-block.has-event .event-text { color: var(--wp-white); font-weight: 600; }

        /* App bar golyóálló verzió */
        .app-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 72px;
            background-color: #2A2A2A; text-align: center; z-index: 50;
        }

        .app-bar-btn {
            display: inline-block; width: 44px; height: 44px; border-radius: 22px;
            border: 2px solid var(--wp-white); color: var(--wp-white);
            text-decoration: none; font-size: 28px; line-height: 38px;
            margin-top: 14px; text-align: center;
        }

        /* Felugró ablakok JS nélküli nyitása (CSS :target) */
        .event-modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh; background-color: var(--wp-black);
            z-index: 100; padding: 24px;
            animation: slideIn 0.25s ease-out forwards;
        }

        .event-modal:target { display: block; }

        /* Űrlap elemek */
        .wp-input {
            width: 100%; background-color: var(--wp-white); border: 2px solid transparent;
            color: var(--wp-black); font-family: inherit; font-size: 16px;
            padding: 8px 12px; margin-top: 16px; outline: none;
        }
        .wp-input:focus { border-color: var(--wp-accent); }

        .wp-button {
            display: inline-block; background-color: transparent;
            border: 2px solid var(--wp-white); color: var(--wp-white);
            text-decoration: none; padding: 8px 24px; font-family: inherit;
            font-size: 16px; cursor: pointer; text-transform: lowercase;
        }
        .wp-button:active { background-color: var(--wp-white); color: var(--wp-black); }
        
        .btn-row { overflow: hidden; margin-top: 24px; }
        .btn-row .wp-button { float: left; margin-right: 16px; }
        .danger-btn { border-color: var(--wp-accent); color: var(--wp-accent); }

        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

    <header>
        <h1>Calendar</h1>
        <div class="month-header">
            <button class="nav-btn" id="prev-day">&#9664;</button>
            <h2 id="display-month"></h2>
            <button class="nav-btn" id="next-day" style="padding: 0 0 0 16px;">&#9654;</button>
        </div>
    </header>

    <!-- Napi nézet csempéi (JS generálja) -->
    <div id="three-day-container"></div>

    <div class="app-bar">
        <a href="#new-event" class="app-bar-btn" id="add-btn">+</a>
    </div>

    <!-- Új esemény űrlap -->
    <div id="new-event" class="event-modal">
        <h1>New event</h1>
        <h2>details</h2>
        <form id="event-form">
            <input type="text" id="ev-title" class="wp-input" placeholder="Subject" required>
            <input type="date" id="ev-date" class="wp-input" required>
            <textarea id="ev-desc" class="wp-input" rows="4" placeholder="Location or notes..."></textarea>
            
            <div class="btn-row">
                <button type="submit" class="wp-button">save</button>
                <a href="#" class="wp-button">cancel</a>
            </div>
        </form>
    </div>

    <!-- Esemény megtekintése -->
    <div id="view-event" class="event-modal">
        <h1 id="view-date-display"></h1>
        <h2 id="view-title"></h2>
        <p id="view-desc" style="margin-top: 24px; font-size: 18px; color: #ccc;"></p>
        
        <div class="btn-row">
            <a href="#" class="wp-button">back</a>
            <button id="delete-btn" class="wp-button danger-btn">delete</button>
        </div>
    </div>

    <script>
        // ES5 Kompatibilis JS Logika
        var realToday = new Date();
        realToday.setHours(0, 0, 0, 0); 

        var viewBaseDate = new Date(); 
        viewBaseDate.setHours(0, 0, 0, 0);

        var monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        var daysArr = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        var selectedDateForView = "";

        // Adatbázis (LocalStorage)
        function getEvents() {
            var data = localStorage.getItem('wp_calendar_events');
            return data ? JSON.parse(data) : {};
        }

        function padNumber(num) {
            return num < 10 ? '0' + num : num;
        }

        // 3-napos nézet rajzolása
        function renderThreeDayView() {
            var container = document.getElementById('three-day-container');
            container.innerHTML = ''; 

            document.getElementById('display-month').innerText = monthNames[viewBaseDate.getMonth()] + ' ' + viewBaseDate.getFullYear();
            var events = getEvents();

            for (var i = -1; i <= 1; i++) {
                var d = new Date(viewBaseDate.getTime() + (i * 86400000));
                var dateStr = d.getFullYear() + '-' + padNumber(d.getMonth() + 1) + '-' + padNumber(d.getDate());

                var diffDays = Math.round((d.getTime() - realToday.getTime()) / 86400000);
                
                var label = daysArr[d.getDay()]; 
                if (diffDays === -1) label = "Yesterday";
                if (diffDays === 0) label = "Today";
                if (diffDays === 1) label = "Tomorrow";

                var block = document.createElement('a');
                block.className = 'day-block';
                if (diffDays === 0) block.className += ' today'; 

                var hasEvent = events[dateStr];
                if (hasEvent) block.className += ' has-event';

                block.href = hasEvent ? '#view-event' : '#new-event';

                (function(dStr, ev) {
                    block.onclick = function() {
                        if (ev) {
                            openEventView(dStr);
                        } else {
                            document.getElementById('ev-date').value = dStr;
                            document.getElementById('ev-title').value = '';
                            document.getElementById('ev-desc').value = '';
                        }
                    };
                })(dateStr, hasEvent);

                var titleHtml = '<div class="day-label">' + label + '</div>';
                var dateHtml = '<div class="day-date">' + padNumber(d.getDate()) + '</div>';
                var eventHtml = '<div class="event-text">' + (hasEvent ? hasEvent.title : 'No events') + '</div>';

                block.innerHTML = titleHtml + dateHtml + eventHtml;
                container.appendChild(block);
            }
        }

        // Részletek megnyitása
        function openEventView(dateStr) {
            var events = getEvents();
            var ev = events[dateStr];
            if (ev) {
                selectedDateForView = dateStr;
                document.getElementById('view-date-display').innerText = dateStr.replace(/-/g, '/');
                document.getElementById('view-title').innerText = ev.title;
                document.getElementById('view-desc').innerText = ev.desc;
            }
        }

        // Lapozás gombok
        document.getElementById('prev-day').onclick = function() {
            viewBaseDate.setTime(viewBaseDate.getTime() - 86400000);
            renderThreeDayView();
        };

        document.getElementById('next-day').onclick = function() {
            viewBaseDate.setTime(viewBaseDate.getTime() + 86400000);
            renderThreeDayView();
        };

        // Új hozzáadása
        document.getElementById('add-btn').onclick = function() {
            var d = new Date();
            var ts = d.getFullYear() + '-' + padNumber(d.getMonth() + 1) + '-' + padNumber(d.getDate());
            document.getElementById('ev-date').value = ts;
            document.getElementById('ev-title').value = '';
            document.getElementById('ev-desc').value = '';
        };

        // Mentés
        document.getElementById('event-form').onsubmit = function(e) {
            e.preventDefault(); 
            var dateVal = document.getElementById('ev-date').value;
            var titleVal = document.getElementById('ev-title').value;
            var descVal = document.getElementById('ev-desc').value;
            
            var events = getEvents();
            events[dateVal] = { title: titleVal, desc: descVal };
            localStorage.setItem('wp_calendar_events', JSON.stringify(events));
            
            window.location.hash = '#'; 
            renderThreeDayView();
        };

        // Törlés
        document.getElementById('delete-btn').onclick = function() {
            var events = getEvents();
            delete events[selectedDateForView];
            localStorage.setItem('wp_calendar_events', JSON.stringify(events));
            
            window.location.hash = '#';
            renderThreeDayView();
        };

        // Kezdő renderelés
        renderThreeDayView();
    </script>
</body>
</html>
