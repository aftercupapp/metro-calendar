<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="msapplication-TileColor" content="#FF0097">
    <meta name="msapplication-TileImage" content="icon-192.png">
    <meta name="theme-color" content="#FF0097">
    <link rel="manifest" href="manifest.json">
    <title>Calendar</title>
    <style>
        :root {
            --wp-black: #000000;
            --wp-white: #FFFFFF;
            --wp-gray: #1F1F1F;
            --wp-light-gray: #999999;
            --wp-accent: #FF0097;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--wp-black);
            color: var(--wp-white);
            font-family: 'Segoe WP', 'Segoe UI', sans-serif;
            padding: 24px 24px 80px 24px;
            overflow-x: hidden;
        }

        header { margin-bottom: 24px; }

        h1 {
            text-transform: uppercase;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--wp-light-gray);
            margin-bottom: 8px;
        }

        .month-header { overflow: hidden; margin-bottom: 16px; display: flex; align-items: center; }

        .nav-btn {
            background: none; border: none; color: var(--wp-white);
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            padding: 0 16px 0 0;
        }

        #display-month {
            display: inline-block;
            font-size: 32px; font-weight: 300; line-height: 1;
            margin-top: -2px; text-transform: lowercase;
        }

        .day-block {
            display: block;
            background-color: var(--wp-gray);
            color: var(--wp-white);
            text-decoration: none;
            padding: 16px;
            margin-bottom: 12px;
            min-height: 140px;
            position: relative;
            transition: background-color 0.1s;
            cursor: pointer;
        }

        .day-block:active { transform: scale(0.98); }
        .day-block.today { background-color: var(--wp-accent); }

        .day-label {
            font-size: 14px;
            text-transform: uppercase;
            color: var(--wp-light-gray);
            letter-spacing: 1px;
            margin-bottom: 4px;
            display: block;
        }
        .day-block.today .day-label { color: var(--wp-white); opacity: 0.8; }

        .day-date {
            font-size: 56px;
            font-weight: 300;
            line-height: 1;
            margin-bottom: 12px;
            display: block;
        }

        .event-list { display: block; }

        .event-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
            font-size: 15px;
            color: var(--wp-light-gray);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .day-block.today .event-item { color: rgba(255,255,255,0.85); }
        .event-item .ev-time {
            font-size: 12px;
            opacity: 0.7;
            flex-shrink: 0;
        }
        .event-item .ev-title {
            font-weight: 600;
            color: var(--wp-white);
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .no-event {
            font-size: 16px;
            color: var(--wp-light-gray);
        }
        .day-block.today .no-event { color: rgba(255,255,255,0.7); }

        /* App bar – WP stílus: nincs gap, egyenlő elosztás */
        .app-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 72px;
            background-color: #2A2A2A; z-index: 50;
            display: flex; justify-content: space-around; align-items: center;
        }

        .app-bar-btn {
            display: inline-flex; justify-content: center; align-items: center;
            width: 44px; height: 44px; border-radius: 22px;
            border: 2px solid var(--wp-white); color: var(--wp-white); background: transparent;
            text-decoration: none; font-size: 26px; line-height: 1;
            text-align: center; cursor: pointer; font-family: inherit; font-weight: 300;
            padding: 0;
        }

        /* Modálok */
        .event-modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh; background-color: var(--wp-black);
            z-index: 100; padding: 24px; overflow-y: auto;
            animation: slideIn 0.25s ease-out forwards;
        }
        .event-modal:target { display: block; }

        .wp-input {
            width: 100%; background-color: var(--wp-white); border: 2px solid transparent;
            color: var(--wp-black); font-family: inherit; font-size: 16px;
            padding: 8px 12px; margin-top: 16px; outline: none;
        }
        .wp-input:focus { border-color: var(--wp-accent); }

        .wp-button {
            display: inline-block; background-color: transparent;
            border: 2px solid var(--wp-white); color: var(--wp-white);
            text-decoration: none; padding: 8px 24px; font-family: inherit;
            font-size: 16px; cursor: pointer; text-transform: lowercase;
        }
        .wp-button:active { background-color: var(--wp-white); color: var(--wp-black); }

        .btn-row { overflow: hidden; margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px; }
        .danger-btn { border-color: var(--wp-accent); color: var(--wp-accent); }

        /* Eseménylista a nézet modalban */
        .ev-list-item {
            border-left: 3px solid var(--wp-accent);
            padding: 10px 14px;
            margin-bottom: 12px;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .ev-list-item .ev-list-time {
            font-size: 12px;
            color: var(--wp-accent);
            letter-spacing: 1px;
        }
        .ev-list-item .ev-list-title {
            font-size: 18px;
            font-weight: 600;
        }
        .ev-list-item .ev-list-desc {
            font-size: 14px;
            color: #ccc;
        }
        .ev-list-delete {
            align-self: flex-end;
            background: none;
            border: 1px solid var(--wp-accent);
            color: var(--wp-accent);
            font-family: inherit;
            font-size: 13px;
            padding: 3px 10px;
            cursor: pointer;
            text-transform: lowercase;
            margin-top: 4px;
        }

        /* Havi nézet overlay */
        #month-overlay {
            display: none;
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: var(--wp-black);
            z-index: 200; padding: 24px 16px 80px 16px;
            overflow-y: auto;
            animation: slideIn 0.2s ease-out forwards;
        }
        #month-overlay.open { display: block; }

        .mo-header {
            overflow: hidden; margin-bottom: 20px; position: relative;
        }
        .mo-nav {
            background: none; border: none; color: var(--wp-white);
            cursor: pointer; padding: 0 16px 0 0; float: left;
            display: inline-block; vertical-align: middle; line-height: 0;
        }
        .mo-nav.right { padding: 0 0 0 16px; float: left; }
        #mo-month-label {
            font-size: 32px; font-weight: 300;
            text-transform: lowercase; line-height: 1;
            float: left; display: inline-block;
        }
        .mo-close {
            position: absolute; top: 0; right: 0;
            background: none; border: none; color: var(--wp-white);
            font-size: 28px; cursor: pointer; line-height: 1;
            font-weight: 300;
        }

        /* Table-alapú rács */
        #mo-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        #mo-table th {
            text-align: center; font-size: 11px; font-weight: 600;
            letter-spacing: 1px; color: var(--wp-light-gray);
            text-transform: uppercase; padding: 4px 0 8px 0;
        }
        #mo-table th.weekend { color: var(--wp-accent); }
        #mo-table td {
            text-align: center; vertical-align: middle;
            height: 44px; font-size: 16px; font-weight: 300;
            color: var(--wp-white); cursor: pointer;
            position: relative;
        }
        #mo-table td.empty { cursor: default; }
        #mo-table td.today { background-color: var(--wp-accent); }
        #mo-table td.weekend-cell { color: var(--wp-accent); }
        #mo-table td.today.weekend-cell { color: var(--wp-white); }
        #mo-table td.has-event { font-weight: 600; }

        /* Téma színek */
        .theme-grid { margin-top: 24px; overflow: hidden; }
        .theme-row { overflow: hidden; margin-bottom: 12px; }
        .theme-swatch-wrap { float: left; width: 25%; padding: 0 6px 0 0; box-sizing: border-box; }
        .theme-swatch-wrap:nth-child(4n) { padding-right: 0; }
        .theme-swatch {
            width: 100%; height: 64px; cursor: pointer;
            border: 3px solid transparent;
        }
        .theme-swatch.active { border-color: var(--wp-white); }
        .theme-swatch-wrap span {
            display: block; font-size: 11px; text-align: center;
            margin-top: 5px; color: var(--wp-light-gray); text-transform: lowercase; letter-spacing: 0.5px;
        }

        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

    <!-- Havi nézet overlay -->
    <div id="month-overlay">
        <div class="mo-header">
            <button class="mo-nav" id="mo-prev">
                <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="1.5" fill="none"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <span id="mo-month-label"></span>
            <button class="mo-nav right" id="mo-next">
                <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="1.5" fill="none"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
            <button class="mo-close" id="mo-close">&#x2715;</button>
        </div>
        <table id="mo-table">
            <thead>
                <tr>
                    <th>Mo</th>
                    <th>Tu</th>
                    <th>We</th>
                    <th>Th</th>
                    <th>Fr</th>
                    <th class="weekend">Sa</th>
                    <th class="weekend">Su</th>
                </tr>
            </thead>
            <tbody id="mo-tbody"></tbody>
        </table>
    </div>

    <header>
        <h1>Aftercup Calendar</h1>
        <div class="month-header">
            <button class="nav-btn" id="prev-day">
                <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="1.5" fill="none"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
        <h2 id="display-month" style="cursor:pointer;" title="Monthly view"></h2>
            <button class="nav-btn" id="next-day" style="padding: 0 0 0 16px;">
                <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="1.5" fill="none"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </div>
    </header>

    <div id="three-day-container"></div>

    <div class="app-bar">
        <button class="app-bar-btn" id="fullscreen-btn" title="Teljes képernyő">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
        </button>
        <a href="#new-event" class="app-bar-btn" id="add-btn">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </a>
        <a href="#settings" class="app-bar-btn" title="Settings">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </a>
    </div>

    <!-- Új esemény modal -->
    <div id="new-event" class="event-modal">
        <h1>New event</h1>
        <h2>details</h2>
        <form id="event-form">
            <input type="text" id="ev-title" class="wp-input" placeholder="Subject" required>
            <input type="date" id="ev-date" class="wp-input" required>
            <input type="time" id="ev-time" class="wp-input">
            <textarea id="ev-desc" class="wp-input" rows="4" placeholder="Location or notes..."></textarea>
            <div class="btn-row">
                <button type="submit" class="wp-button">save</button>
                <a href="#" class="wp-button">cancel</a>
            </div>
        </form>
    </div>

    <!-- Nap nézet modal – több eseménnyel -->
    <div id="view-event" class="event-modal">
        <h1 id="view-date-display"></h1>
        <h2 style="margin-bottom: 20px; font-weight: 300; text-transform: lowercase;">events</h2>
        <div id="view-events-list"></div>
        <div class="btn-row">
            <a href="#" class="wp-button">back</a>
            <a href="#new-event" id="view-add-btn" class="wp-button" style="border-color: var(--wp-accent); color: var(--wp-accent);">+ add</a>
        </div>
    </div>

    <!-- Settings modal -->
    <div id="settings" class="event-modal">
        <h1>Settings</h1>
        <h2 style="font-weight:300; text-transform:lowercase; margin-bottom:8px;">theme color</h2>
        <div class="theme-grid" id="theme-grid"></div>
        <div class="btn-row">
            <a href="#" class="wp-button">back</a>
        </div>
    </div>

    <script>
        // Témák
        var themes = [
            { name: 'pink',    color: '#FF0097' },
            { name: 'blue',    color: '#1BA1E2' },
            { name: 'green',   color: '#339933' },
            { name: 'orange',  color: '#E3A21A' },
            { name: 'red',     color: '#E51400' },
            { name: 'purple',  color: '#AA00FF' },
            { name: 'teal',    color: '#00ABA9' },
            { name: 'lime',    color: '#8CBF26' }
        ];

        function applyTheme(color) {
            document.documentElement.style.setProperty('--wp-accent', color);
            localStorage.setItem('wp_theme', color);
        }

        function renderThemeGrid() {
            var grid = document.getElementById('theme-grid');
            grid.innerHTML = '';
            var current = localStorage.getItem('wp_theme') || '#FF0097';
            var row;
            themes.forEach(function(t, idx) {
                if (idx % 4 === 0) {
                    row = document.createElement('div');
                    row.className = 'theme-row';
                    grid.appendChild(row);
                }
                var wrap = document.createElement('div');
                wrap.className = 'theme-swatch-wrap';

                var swatch = document.createElement('div');
                swatch.className = 'theme-swatch' + (t.color === current ? ' active' : '');
                swatch.style.backgroundColor = t.color;
                swatch.onclick = function() {
                    applyTheme(t.color);
                    renderThemeGrid();
                };

                var label = document.createElement('span');
                label.innerText = t.name;

                wrap.appendChild(swatch);
                wrap.appendChild(label);
                row.appendChild(wrap);
            });
        }

        var savedTheme = localStorage.getItem('wp_theme');
        if (savedTheme) applyTheme(savedTheme);

        document.querySelector('a[href="#settings"]').addEventListener('click', function() {
            renderThemeGrid();
        });

        var realToday = new Date();
        realToday.setHours(0, 0, 0, 0);

        var viewBaseDate = new Date();
        viewBaseDate.setHours(0, 0, 0, 0);

        var monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        var daysArr = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        var currentViewDate = "";

        function getEvents() {
            var data = localStorage.getItem('wp_calendar_events_v2');
            return data ? JSON.parse(data) : {};
        }

        function saveEvents(events) {
            localStorage.setItem('wp_calendar_events_v2', JSON.stringify(events));
        }

        function padNumber(num) {
            return num < 10 ? '0' + num : num;
        }

        function renderThreeDayView() {
            var container = document.getElementById('three-day-container');
            container.innerHTML = '';
            document.getElementById('display-month').innerText = monthNames[viewBaseDate.getMonth()] + ' ' + viewBaseDate.getFullYear();
            var events = getEvents();

            for (var i = -1; i <= 1; i++) {
                var d = new Date(viewBaseDate.getTime() + (i * 86400000));
                var dateStr = d.getFullYear() + '-' + padNumber(d.getMonth() + 1) + '-' + padNumber(d.getDate());
                var diffDays = Math.round((d.getTime() - realToday.getTime()) / 86400000);

                var label = daysArr[d.getDay()];
                if (diffDays === -1) label = "Yesterday";
                if (diffDays === 0) label = "Today";
                if (diffDays === 1) label = "Tomorrow";

                var block = document.createElement('div');
                block.className = 'day-block';
                if (diffDays === 0) block.className += ' today';

                var dayEvents = events[dateStr] || [];

                var titleHtml = '<div class="day-label">' + label + '</div>';
                var dateHtml = '<div class="day-date">' + padNumber(d.getDate()) + '</div>';

                var eventHtml = '<div class="event-list">';
                if (dayEvents.length === 0) {
                    eventHtml += '<div class="no-event">No events</div>';
                } else {
                    for (var j = 0; j < Math.min(dayEvents.length, 3); j++) {
                        var ev = dayEvents[j];
                        eventHtml += '<div class="event-item">';
                        if (ev.time) {
                            eventHtml += '<span class="ev-time">' + ev.time + '</span>';
                        }
                        eventHtml += '<span class="ev-title">' + ev.title + '</span></div>';
                    }
                    if (dayEvents.length > 3) {
                        eventHtml += '<div class="event-item"><span class="ev-time">+' + (dayEvents.length - 3) + ' more</span></div>';
                    }
                }
                eventHtml += '</div>';

                block.innerHTML = titleHtml + dateHtml + eventHtml;

                (function(dStr, hasEvents) {
                    block.onclick = function() {
                        openDayView(dStr);
                        window.location.hash = '#view-event';
                    };
                })(dateStr, dayEvents.length > 0);

                container.appendChild(block);
            }
        }

        function openDayView(dateStr) {
            currentViewDate = dateStr;
            var events = getEvents();
            var dayEvents = events[dateStr] || [];

            document.getElementById('view-date-display').innerText = dateStr.replace(/-/g, '/');

            var list = document.getElementById('view-events-list');
            list.innerHTML = '';

            if (dayEvents.length === 0) {
                list.innerHTML = '<p style="color:#999; font-size:16px; margin-bottom:16px;">No events for this day.</p>';
            } else {
                // Rendezés időpont szerint
                var sorted = dayEvents.slice().sort(function(a, b) {
                    return (a.time || '99:99').localeCompare(b.time || '99:99');
                });
                for (var i = 0; i < sorted.length; i++) {
                    (function(ev, idx) {
                        var item = document.createElement('div');
                        item.className = 'ev-list-item';
                        var timeHtml = ev.time ? '<div class="ev-list-time">' + ev.time + '</div>' : '';
                        var descHtml = ev.desc ? '<div class="ev-list-desc">' + ev.desc + '</div>' : '';
                        item.innerHTML = timeHtml +
                            '<div class="ev-list-title">' + ev.title + '</div>' +
                            descHtml;
                        var delBtn = document.createElement('button');
                        delBtn.className = 'ev-list-delete';
                        delBtn.innerText = 'delete';
                        delBtn.onclick = function() {
                            deleteEvent(dateStr, idx);
                        };
                        item.appendChild(delBtn);
                        list.appendChild(item);
                    })(sorted[i], i);
                }
            }

            // "+ add" gomb előre tölti a dátumot
            document.getElementById('view-add-btn').onclick = function() {
                document.getElementById('ev-date').value = dateStr;
                document.getElementById('ev-title').value = '';
                document.getElementById('ev-time').value = '';
                document.getElementById('ev-desc').value = '';
            };
        }

        function deleteEvent(dateStr, idx) {
            var events = getEvents();
            var dayEvents = events[dateStr] || [];
            // Rendezés után törlés (azonos logika mint megjelenítésnél)
            var sorted = dayEvents.slice().sort(function(a, b) {
                return (a.time || '99:99').localeCompare(b.time || '99:99');
            });
            sorted.splice(idx, 1);
            if (sorted.length === 0) {
                delete events[dateStr];
            } else {
                events[dateStr] = sorted;
            }
            saveEvents(events);
            openDayView(dateStr);
            renderThreeDayView();
        }

        // --- Havi nézet logika ---
        var moDate = new Date(viewBaseDate.getFullYear(), viewBaseDate.getMonth(), 1);

        function renderMonthOverlay() {
            var events = getEvents();
            var y = moDate.getFullYear();
            var m = moDate.getMonth();

            document.getElementById('mo-month-label').innerText = monthNames[m] + ' ' + y;

            var tbody = document.getElementById('mo-tbody');
            tbody.innerHTML = '';

            var firstDay = new Date(y, m, 1).getDay();
            var offset = (firstDay === 0) ? 6 : firstDay - 1;
            var daysInMonth = new Date(y, m + 1, 0).getDate();

            var cells = [];
            for (var i = 0; i < offset; i++) cells.push(null);
            for (var d = 1; d <= daysInMonth; d++) cells.push(d);
            while (cells.length % 7 !== 0) cells.push(null);

            for (var r = 0; r < cells.length / 7; r++) {
                var tr = document.createElement('tr');
                for (var c = 0; c < 7; c++) {
                    var day = cells[r * 7 + c];
                    var td = document.createElement('td');

                    if (day === null) {
                        td.className = 'empty';
                    } else {
                        var dateStr = y + '-' + padNumber(m + 1) + '-' + padNumber(day);
                        var cellDate = new Date(y, m, day);
                        var diffDays = Math.round((cellDate.getTime() - realToday.getTime()) / 86400000);
                        var dow = cellDate.getDay();
                        var cls = '';
                        if (diffDays === 0) cls += ' today';
                        if (dow === 6 || dow === 0) cls += ' weekend-cell';
                        var dayEvs = events[dateStr] || [];
                        if (dayEvs.length > 0) cls += ' has-event';
                        td.className = cls;
                        td.innerText = day;

                        (function(ds) {
                            td.onclick = function() {
                                document.getElementById('month-overlay').classList.remove('open');
                                var parts = ds.split('-');
                                viewBaseDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                                viewBaseDate.setHours(0, 0, 0, 0);
                                renderThreeDayView();
                            };
                        })(dateStr);
                    }
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
        }

        document.getElementById('display-month').onclick = function() {
            moDate = new Date(viewBaseDate.getFullYear(), viewBaseDate.getMonth(), 1);
            renderMonthOverlay();
            document.getElementById('month-overlay').classList.add('open');
        };

        document.getElementById('mo-close').onclick = function() {
            document.getElementById('month-overlay').classList.remove('open');
        };

        document.getElementById('mo-prev').onclick = function() {
            moDate.setMonth(moDate.getMonth() - 1);
            renderMonthOverlay();
        };

        document.getElementById('mo-next').onclick = function() {
            moDate.setMonth(moDate.getMonth() + 1);
            renderMonthOverlay();
        };
        // --- Havi nézet vége ---

        document.getElementById('prev-day').onclick = function() {
            viewBaseDate.setTime(viewBaseDate.getTime() - 86400000);
            renderThreeDayView();
        };

        document.getElementById('next-day').onclick = function() {
            viewBaseDate.setTime(viewBaseDate.getTime() + 86400000);
            renderThreeDayView();
        };

        document.getElementById('add-btn').onclick = function() {
            var d = new Date();
            var ts = d.getFullYear() + '-' + padNumber(d.getMonth() + 1) + '-' + padNumber(d.getDate());
            document.getElementById('ev-date').value = ts;
            document.getElementById('ev-title').value = '';
            document.getElementById('ev-time').value = '';
            document.getElementById('ev-desc').value = '';
        };

        document.getElementById('event-form').onsubmit = function(e) {
            e.preventDefault();
            var dateVal = document.getElementById('ev-date').value;
            var titleVal = document.getElementById('ev-title').value;
            var timeVal = document.getElementById('ev-time').value;
            var descVal = document.getElementById('ev-desc').value;

            var events = getEvents();
            if (!events[dateVal]) events[dateVal] = [];
            events[dateVal].push({ title: titleVal, time: timeVal, desc: descVal });
            saveEvents(events);

            window.location.hash = '#';
            renderThreeDayView();
        };

        document.getElementById('fullscreen-btn').onclick = function() {
            var doc = window.document;
            var docEl = doc.documentElement;
            var requestFS = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            var exitFS = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;
            if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
                if (requestFS) requestFS.call(docEl);
            } else {
                if (exitFS) exitFS.call(doc);
            }
        };

        renderThreeDayView();
    </script>
</body>
</html>
